<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sri Kotala</title>
    <meta name="description" content="Sri Kotala's portfolio, reimagined as a Spotify player. Projects, experience, research, and photography." />
    <link rel="icon" type="image/png" href="./favicon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700;900&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="./app.css" />
  </head>
  <body class="sp-body">
    <div class="sp">
      <!-- ===== Sidebar ===== -->
      <aside class="side">
        <div class="side-top">
          <div class="brand" data-route="home" role="link" tabindex="0" aria-label="Home"><img src="./favicon.png" alt="Koala logo" /><span>Sri<span class="g"> Kotala</span></span></div>
          <nav class="side-nav" aria-label="App">
            <a data-nav="home"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 3 2 12h3v8h6v-6h2v6h6v-8h3z"/></svg>Home</a>
            <a data-nav="search"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><line x1="16.5" y1="16.5" x2="21" y2="21"/></svg>Search</a>
          </nav>
        </div>
        <div class="side-lib">
          <div class="lib-head"><span>My Portfolio</span></div>
          <ul class="lib-list">
            <li data-lib="about"><div class="lib-cover"><img src="./assets/headshot-angel.jpg" alt=""></div><div class="lib-meta"><div class="lib-name">This Is Sri Kotala</div><div class="lib-sub">Artist profile</div></div></li>
            <li data-lib="experience"><div class="lib-cover"><img src="./assets/covers/experience.jpg" alt=""></div><div class="lib-meta"><div class="lib-name">Experience & Research</div><div class="lib-sub">Playlist · resume</div></div></li>
            <li data-lib="projects"><div class="lib-cover"><img src="./assets/covers/projects.jpg" alt=""></div><div class="lib-meta"><div class="lib-name">Projects</div><div class="lib-sub">Playlist · builds</div></div></li>
            <li data-lib="photos"><div class="lib-cover"><img src="./assets/covers/photography.jpg" alt=""></div><div class="lib-meta"><div class="lib-name">Photography</div><div class="lib-sub">Playlist · photos</div></div></li>
            <li data-lib="connect"><div class="lib-cover"><img src="./assets/covers/connect.jpg" alt=""></div><div class="lib-meta"><div class="lib-name">Let's Connect</div><div class="lib-sub">Links & booking</div></div></li>
          </ul>
        </div>
      </aside>

      <!-- ===== Main ===== -->
      <main class="main" data-main>
        <div class="main-head">
          <div class="nav-arrows">
            <button class="round-btn" data-back aria-label="Back"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 6l-6 6 6 6"/></svg></button>
            <button class="round-btn" data-fwd aria-label="Forward"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 6l6 6-6 6"/></svg></button>
          </div>
          <label class="search-box" data-search-box>
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><line x1="16.5" y1="16.5" x2="21" y2="21"/></svg>
            <input type="search" placeholder="What do you want to explore?" data-search-input aria-label="Search" />
          </label>
          <div class="head-spacer"></div>
          <div class="lang" data-lang-wrap>
            <button class="theme-btn lang-btn" type="button" data-lang-toggle aria-label="Language" title="Language">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M3 12h18"/><path d="M12 3a15 15 0 0 1 0 18a15 15 0 0 1 0-18"/></svg>
              <span class="lang-code" data-lang-code>EN</span>
            </button>
            <div class="lang-menu" data-lang-menu hidden>
              <button type="button" class="lang-opt" data-lang="en">English</button>
              <button type="button" class="lang-opt" data-lang="es">Español</button>
            </div>
          </div>
          <button class="theme-btn" type="button" data-theme-toggle aria-label="Switch theme" title="Switch theme">
            <svg class="theme-ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
              <mask id="theme-moon-mask">
                <rect x="0" y="0" width="24" height="24" fill="#fff"/>
                <circle class="mask-c" cx="12" cy="12" r="6" fill="#000"/>
              </mask>
              <circle class="core" cx="12" cy="12" r="5.2" fill="currentColor" stroke="none" mask="url(#theme-moon-mask)"/>
              <g class="rays" stroke="currentColor">
                <line x1="12" y1="1.5" x2="12" y2="4"/>
                <line x1="12" y1="20" x2="12" y2="22.5"/>
                <line x1="1.5" y1="12" x2="4" y2="12"/>
                <line x1="20" y1="12" x2="22.5" y2="12"/>
                <line x1="18.7" y1="5.3" x2="16.9" y2="7.1"/>
                <line x1="5.3" y1="18.7" x2="7.1" y2="16.9"/>
                <line x1="5.3" y1="5.3" x2="7.1" y2="7.1"/>
                <line x1="18.7" y1="18.7" x2="16.9" y2="16.9"/>
              </g>
            </svg>
          </button>
        </div>
        <div class="view" data-view></div>
      </main>

      <!-- ===== Player ===== -->
      <footer class="player">
        <canvas class="viz" data-viz aria-hidden="true"></canvas>
        <div class="now">
          <div class="now-art" data-now-art>🎧</div>
          <div class="now-meta">
            <div class="now-title" data-now-title>Press play</div>
            <div class="now-artist" data-now-artist>A dive into my favorite songs</div>
          </div>
        </div>
        <div class="center">
          <div class="controls">
            <button class="ctrl" data-shuffle aria-label="Shuffle"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 3h5v5"/><path d="M4 20 21 3"/><path d="M21 16v5h-5"/><path d="M15 15l6 6"/><path d="M4 4l5 5"/></svg></button>
            <button class="ctrl" data-prev aria-label="Previous"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M6 5h2v14H6zM20 5 9 12l11 7z"/></svg></button>
            <button class="ctrl ctrl-play" data-playpause aria-label="Play">
              <svg data-icon-play viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
              <svg data-icon-pause viewBox="0 0 24 24" fill="currentColor" style="display:none"><path d="M7 5h4v14H7zM13 5h4v14h-4z"/></svg>
            </button>
            <button class="ctrl" data-next aria-label="Next"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M16 5h2v14h-2zM4 5l11 7-11 7z"/></svg></button>
            <button class="ctrl" data-repeat aria-label="Repeat"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 2l4 4-4 4"/><path d="M3 11V9a4 4 0 0 1 4-4h14"/><path d="M7 22l-4-4 4-4"/><path d="M21 13v2a4 4 0 0 1-4 4H3"/></svg></button>
          </div>
          <div class="progress">
            <span class="time" data-cur>0:00</span>
            <input class="range fill" type="range" min="0" max="1000" value="0" data-seek aria-label="Seek" />
            <span class="time" data-dur>0:00</span>
          </div>
        </div>
        <div class="right">
          <button class="ctrl" data-queue-toggle aria-label="Playlist" title="Playlist"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="3" y1="6" x2="15" y2="6"/><line x1="3" y1="12" x2="15" y2="12"/><line x1="3" y1="18" x2="11" y2="18"/><path d="M16 8v9" /><circle cx="19" cy="17" r="2.4"/></svg></button>
          <div class="vol">
            <button class="ctrl" data-mute aria-label="Mute" title="Mute">
              <svg data-vol-on viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5 6 9H2v6h4l5 4z"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/><path d="M19 5a9 9 0 0 1 0 14"/></svg>
              <svg data-vol-off viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display:none"><path d="M11 5 6 9H2v6h4l5 4z"/><line x1="17" y1="9" x2="23" y2="15"/><line x1="23" y1="9" x2="17" y2="15"/></svg>
            </button>
            <input class="range fill" type="range" min="0" max="100" value="75" data-volume aria-label="Volume" />
          </div>
        </div>
      </footer>

      <!-- Library / playlist popover — kept outside .player so its overflow:hidden can't clip it. Filled by JS. -->
      <div class="queue-panel" data-queue-panel hidden></div>
    </div>

    <!-- lightbox + audio -->
    <div class="lightbox" data-lightbox>
      <button class="lightbox-close" data-lb-close aria-label="Close">&times;</button>
      <img data-lb-img alt="" />
      <div class="lightbox-cap" data-lb-cap></div>
    </div>
    <!-- hidden YouTube audio host (IFrame API replaces this div) -->
    <div class="yt-hide"><div id="yt-host"></div></div>

    <script src="./app.js"></script>
  </body>
</html>
